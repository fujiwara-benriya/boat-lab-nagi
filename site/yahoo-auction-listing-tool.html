<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヤフオク出品CSV作成</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --panel: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --warn: #b45309;
      --danger: #b91c1c;
      --soft: #e7f3f1;
      --radius: 8px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      min-height: 40px;
      padding: 0 12px;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button.danger {
      border-color: #fecaca;
      color: var(--danger);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    main {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      min-height: 0;
    }

    .app:not(.saved-view) main {
      grid-template-columns: 1fr;
    }

    .app:not(.saved-view) aside {
      display: none;
    }

    .app.saved-view .workspace {
      display: none;
    }

    .app.saved-view main {
      grid-template-columns: 1fr;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fff;
      min-height: 0;
      overflow: auto;
    }

    .list-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
    }

    .listing-list {
      display: grid;
    }

    .listing-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      min-height: 72px;
      padding: 10px 14px;
      text-align: left;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      background: #fff;
    }

    .listing-item.active {
      background: var(--soft);
    }

    .thumb {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      background: #e2e8f0;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .item-title {
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .item-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .section-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .section-body {
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .camera-box {
      display: grid;
      gap: 12px;
    }

    video,
    canvas {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111827;
      object-fit: cover;
    }

    .camera-actions,
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 8px;
    }

    .photo {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #f8fafc;
    }

    .photo img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .photo button {
      position: absolute;
      top: 4px;
      right: 4px;
      min-height: 28px;
      padding: 0 8px;
      background: rgba(255, 255, 255, .92);
    }

    form {
      display: grid;
      gap: 16px;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: #334155;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      min-height: 40px;
      padding: 8px 10px;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.55;
    }

    .status {
      border-radius: 6px;
      padding: 10px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .status strong {
      color: var(--ink);
    }

    .missing {
      color: var(--warn);
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 980px) {
      main,
      .grid {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 280px;
      }
    }

    @media (max-width: 620px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions {
        justify-content: stretch;
      }

      .header-actions button,
      .camera-actions button,
      .row-actions button {
        flex: 1 1 140px;
      }

      .workspace {
        padding: 12px;
      }

      .fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>ヤフオク出品CSV作成</h1>
      <div class="header-actions">
        <button id="newListingBtn" class="primary" type="button">次の商品を追加</button>
        <button id="showSavedBtn" type="button">保存済み商品</button>
        <button id="exportPackageBtn" type="button">納品ファイル保存</button>
        <button id="shareDataBtn" type="button">共有データ保存</button>
        <button id="importDataBtn" type="button">共有データ読込</button>
        <button id="clearAllBtn" class="danger" type="button">全削除</button>
        <input id="importDataInput" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main>
      <aside>
        <div class="list-head">
          <strong>保存済み商品</strong>
          <div id="summary" class="summary">0件</div>
        </div>
        <div id="listingList" class="listing-list"></div>
      </aside>

      <div id="workspace" class="workspace">
        <div class="empty">
          <div>
            <p><strong>次の商品を追加</strong>を押して、撮影と入力を始めます。</p>
            <p>入力内容と写真はこのブラウザ内に保存されます。</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <template id="editorTemplate">

            <button id="stopCameraBtn" type="button" disabled>ライブ停止</button>

          <input id="cameraPhotoInput" type="file" accept="image/*" capture="environment" multiple hidden>
          <input id="galleryPhotoInput" type="file" accept="image/*" multiple hidden>
          <div id="photos" class="photos"></div>
        </div>
      </section>

          <span id="saveState" class="summary">保存済み</span>
        </div>
        <div class="section-body">
          <form id="listingForm">

                <label for="categoryName">カテゴリ名</label>

                  <option>コンピュータ</option>
                  <option>音楽</option>
                  <option>本、雑誌</option>
                  <option>映画、ビデオ</option>
                  <option>おもちゃ、ゲーム</option>
                  <option>ホビー、カルチャー</option>
                  <option>アンティーク、コレクション</option>
                  <option>スポーツ、レジャー</option>
                  <option>自動車、オートバイ</option>
                  <option>ファッション</option>
                  <option>アクセサリー、時計</option>
                  <option>ビューティー、ヘルスケア</option>
                  <option>住まい、インテリア</option>
                  <option>事務、店舗用品</option>
                  <option>その他</option>

              </div>

              <div class="field">
                <label for="condition">状態</label>

              <div class="field">
                <label for="quantity">数量</label>

              <div class="field">
                <label for="sizeWeight">商品のサイズ</label>

                  <option>80サイズ</option>
                  <option>100サイズ</option>
                  <option>120サイズ</option>
                  <option>140サイズ</option>

              </div>

              <div class="field">
                <label for="startPrice">開始価格</label>
                <input id="startPrice" name="startPrice" type="number" min="1" inputmode="numeric">
              </div>

              <div class="field">
                <label for="listingDays">開催日数</label>
                <select id="listingDays" name="listingDays">

              <div class="field">

                  <option>金曜日</option>

              </div>

              <div class="field">
                <label for="endTimeSlot">終了時間</label>
                <select id="endTimeSlot" name="endTimeSlot">
                  <option value="">指定なし</option>

                  <option>2時</option>

                  <option>4時</option>
                  <option>5時</option>
                  <option>6時</option>
                  <option>7時</option>
                  <option>8時</option>
                  <option>9時</option>
                  <option>10時</option>
                  <option>11時</option>
                  <option>12時</option>
                  <option>13時</option>
                  <option>14時</option>
                  <option>15時</option>
                  <option>16時</option>
                  <option>17時</option>
                  <option>18時</option>
                  <option>19時</option>
                  <option>20時</option>
                  <option selected>21時</option>
                  <option>22時</option>
                  <option>23時</option>
                </select>
              </div>

              <div class="field">

                <select id="shippingPayer" name="shippingPayer">
                  <option selected>落札者</option>

                </select>
              </div>

              <div class="field">
                <label for="shippingMethod">発送方法</label>
                <select id="shippingMethod" name="shippingMethod">
                  <option value="">選択してください</option>
                  <option>おてがる配送（ヤマト運輸）</option>
                  <option>おてがる配送（日本郵便）</option>
                  <option>宅急便（ヤマト運輸）</option>
                  <option>ゆうパック</option>
                  <option>佐川急便</option>
                  <option>定形外郵便</option>
                  <option>レターパックプラス</option>
                  <option>レターパックライト</option>
                  <option>クリックポスト</option>
                  <option>ネコポス</option>
                  <option>直接引き取り</option>

              </div>

              <div class="field">
                <label for="shippingOrigin">発送元</label>

                  <option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option>
                  <option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option>
                  <option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option>
                  <option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
                </select>
              </div>

              <div class="field full">
                <label for="description">商品説明</label>
                <textarea id="description" name="description"></textarea>
              </div>

              <div class="field full">
                <label for="returnsPolicy">返品について</label>
                <select id="returnsPolicy" name="returnsPolicy">
                  <option>ノークレーム、ノーリターンでお願いいたします。</option>
                  <option>返品不可。説明と異なる重大な不備がある場合は取引メッセージで相談。</option>

            </div>

            <div id="validationStatus" class="status"></div>

            <div class="row-actions">

  <script>
    const STORAGE_KEY = "yahooAuctionListingTool.v1";
    const DB_NAME = "yahooAuctionListingTool";
    const DB_VERSION = 1;
    const DB_STORE = "appState";
    const PHOTO_LIMIT = 10;

    const state = {
      listings: [],
      selectedId: null,
      stream: null,
      saveTimer: null,
    };

    const columns = [
      "item_id",
      "image_1",
      "image_2",
      "image_3",
      "image_4",
      "image_5",
      "image_6",
      "image_7",

      "size_weight",

      "review_status",

      "説明",
      "開始価格",
      "即決価格",
      "個数",
      "開催期間",
      "終了時間",
      "JANコード",
      "画像1",
      "画像2",
      "画像3",
      "画像4",
      "画像5",
      "画像6",
      "画像7",
      "画像8",
      "画像9",
      "画像10",
      "商品発送元の都道府県",
      "商品発送元の市区町村",
      "送料負担",
      "代金支払い",
      "yahoo!簡単決済",
      "商品代引",
      "商品の状態",
      "商品の状態備考",
      "返品の可否",
      "返品の可否備考",
      "入札者評価制限",
      "悪い評価の割合で制限",
      "入札者認証制限",
      "自動延長",
      "早期終了",
      "値下げ交渉",
      "自動再出品",
      "自動値下げ",
      "自動値下げ価格変更率",
      "送料固定",

      "荷物の重量",

      "ゆうパケット",

      "配送方法1",
      "配送方法1全国一律価格",
      "北海道料金1",
      "沖縄料金1",
      "離島料金1",
      "海外発送",
      "出品者情報開示前チェック",
    ];

    const els = {
      app: document.querySelector(".app"),
      newListingBtn: document.getElementById("newListingBtn"),
      showSavedBtn: document.getElementById("showSavedBtn"),
      exportPackageBtn: document.getElementById("exportPackageBtn"),
      shareDataBtn: document.getElementById("shareDataBtn"),
      importDataBtn: document.getElementById("importDataBtn"),
      importDataInput: document.getElementById("importDataInput"),
      clearAllBtn: document.getElementById("clearAllBtn"),
      summary: document.getElementById("summary"),
      listingList: document.getElementById("listingList"),
      workspace: document.getElementById("workspace"),
      editorTemplate: document.getElementById("editorTemplate"),
    };

    init();

    async function init() {
      await load();
      bindShellActions();
      render();
    }

    function bindShellActions() {
      els.newListingBtn.addEventListener("click", () => {
        const listing = createListing();
        state.listings.unshift(listing);
        state.selectedId = listing.id;
        els.app.classList.remove("saved-view");
        persist();
        render();
      });

      els.showSavedBtn.addEventListener("click", () => {
        els.app.classList.add("saved-view");
        renderList();
      });

      els.exportPackageBtn.addEventListener("click", exportListingPackage);
      els.shareDataBtn.addEventListener("click", exportShareData);
      els.importDataBtn.addEventListener("click", () => els.importDataInput.click());
      els.importDataInput.addEventListener("change", importShareData);

      els.clearAllBtn.addEventListener("click", () => {
        if (!confirm("保存済みの商品データをすべて削除します。よろしいですか？")) return;
        stopCamera();
        state.listings = [];
        state.selectedId = null;
        persist();
        render();
      });
    }

    function createListing(seed = {}) {
      const id = seed.id || safeId();
      const itemId = seed.itemId || buildItemId();
      return {
        id,
        itemId,
        photos: seed.photos ? structuredClone(seed.photos) : [],
        title: seed.title || "",
        categoryName: seed.categoryName || "",
        categoryId: seed.categoryId || "",
        condition: seed.condition || "やや傷や汚れあり",
        conditionNote: seed.conditionNote || "",
        brand: seed.brand || "",
        modelNumber: seed.modelNumber || "",
        janOrIsbn: seed.janOrIsbn || "",
        accessories: seed.accessories || "",
        sizeWeight: seed.sizeWeight || "",
        startPrice: seed.startPrice || "",
        buyoutPrice: seed.buyoutPrice || "",
        quantity: seed.quantity || "1",
        listingDays: seed.listingDays || "7",
        endDay: seed.endDay || "",
        endTimeSlot: seed.endTimeSlot || "21時",
        shippingPayer: seed.shippingPayer || "落札者",
        shippingMethod: seed.shippingMethod || "",
        shippingOrigin: seed.shippingOrigin || "",
        returnsPolicy: seed.returnsPolicy || "ノークレーム、ノーリターンでお願いいたします。",
        description: seed.description || defaultDescription(),
        legalCheck: seed.legalCheck || "",
        reviewStatus: "ready",
        createdAt: seed.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
    }

    function buildItemId() {
      const d = new Date();
      const date = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      const seq = String(state.listings.length + 1).padStart(3, "0");
      return `${date}-${seq}`;
    }

    function render() {
      renderList();
      const listing = currentListing();
      if (!listing) {
        stopCamera();
        els.workspace.innerHTML = '<div class="empty"><div><p><strong>次の商品を追加</strong>を押して、撮影と入力を始めます。</p><p>入力内容と写真はこのブラウザ内に保存されます。</p><p>スマホでは「カメラ/写真を開く」から撮影できます。</p></div></div>';
        return;
      }
      renderEditor(listing);
    }

    function renderList() {
      els.summary.textContent = `${state.listings.length}件`;
      els.listingList.innerHTML = "";

      for (const listing of state.listings) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `listing-item${listing.id === state.selectedId ? " active" : ""}`;
        button.innerHTML = `
          <img class="thumb" alt="" src="${listing.photos[0]?.dataUrl || ""}">
          <div>
            <div class="item-title">${escapeHtml(listing.title || "タイトル未入力")}</div>
            <div class="item-meta">${escapeHtml(listing.itemId)} / CSV出力OK / 写真${listing.photos.length}枚</div>
          </div>
        `;
        button.addEventListener("click", () => {
          stopCamera();
          state.selectedId = listing.id;
          els.app.classList.remove("saved-view");

          render();
        });
        els.listingList.appendChild(button);

    function renderEditor(listing) {
      stopCamera();
      els.workspace.innerHTML = "";
      els.workspace.appendChild(els.editorTemplate.content.cloneNode(true));

      const form = document.getElementById("listingForm");
      const saveState = document.getElementById("saveState");
      const video = document.getElementById("cameraPreview");
      const startCameraBtn = document.getElementById("startCameraBtn");
      const captureBtn = document.getElementById("captureBtn");
      const filePhotoBtn = document.getElementById("filePhotoBtn");
      const cameraPhotoInput = document.getElementById("cameraPhotoInput");
      const galleryPhotoInput = document.getElementById("galleryPhotoInput");
      const stopCameraBtn = document.getElementById("stopCameraBtn");

      setFormValues(form, listing);
      renderPhotos(listing);
      updateValidation(listing);

      form.addEventListener("input", () => {
        applyFormValues(form, listing);
        listing.updatedAt = new Date().toISOString();
        saveState.textContent = "保存中";
        updateValidation(listing);
        renderList();
        schedulePersist((saved) => {
          saveState.textContent = saved ? "保存済み" : "保存失敗";
        });
      });

      form.addEventListener("change", () => {
        applyFormValues(form, listing);
        listing.updatedAt = new Date().toISOString();
        updateValidation(listing);
        persist();
        renderList();
      });

      startCameraBtn.addEventListener("click", async () => {
        cameraPhotoInput.click();
      });

      video.addEventListener("dblclick", async () => {
        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            cameraPhotoInput.click();
            return;
          }
          state.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false,
          });
          video.srcObject = state.stream;
          await video.play();
          startCameraBtn.disabled = true;
          captureBtn.disabled = false;
          stopCameraBtn.disabled = false;
        } catch (error) {
          cameraPhotoInput.click();
        }
      });

      captureBtn.addEventListener("click", () => {
        if (!state.stream || listing.photos.length >= PHOTO_LIMIT) return;
        const dataUrl = captureVideo(video);
        const index = listing.photos.length + 1;
        listing.photos.push({
          id: safeId(),
          fileName: `${listing.itemId}_${String(index).padStart(2, "0")}.jpg`,
          dataUrl,
          createdAt: new Date().toISOString(),
        });
        listing.updatedAt = new Date().toISOString();
        persist();
        renderPhotos(listing);
        renderList();
        updateValidation(listing);
      });

      stopCameraBtn.addEventListener("click", stopCamera);
      filePhotoBtn.addEventListener("click", () => galleryPhotoInput.click());
      cameraPhotoInput.addEventListener("change", () => addFilesToListing(cameraPhotoInput, listing));
      galleryPhotoInput.addEventListener("change", () => addFilesToListing(galleryPhotoInput, listing));

      document.getElementById("buildDescriptionBtn").addEventListener("click", () => {
        applyFormValues(form, listing);
        listing.description = buildDescription(listing);
        setFormValues(form, listing);
        persist();
        saveState.textContent = "保存済み";
      });

      document.getElementById("saveListingBtn").addEventListener("click", async () => {
        const saveButton = document.getElementById("saveListingBtn");
        saveButton.disabled = true;
        saveState.textContent = "保存中";
        applyFormValues(form, listing);
        listing.updatedAt = new Date().toISOString();
        const saved = await persist();
        renderList();
        updateValidation(listing);
        saveState.textContent = saved ? "保存済み" : "保存失敗";
        saveButton.disabled = false;
      });

      document.getElementById("duplicateBtn").addEventListener("click", () => {
        applyFormValues(form, listing);
        const copy = createListing({
          ...listing,
          id: safeId(),
          itemId: buildItemId(),
          photos: [],
          title: `${listing.title} コピー`.trim(),
          reviewStatus: "ready",
        });
        state.listings.unshift(copy);
        state.selectedId = copy.id;
        persist();
        render();
      });

      document.getElementById("deleteListingBtn").addEventListener("click", () => {
        if (!confirm("この商品を削除します。よろしいですか？")) return;
        state.listings = state.listings.filter((item) => item.id !== listing.id);
        state.selectedId = state.listings[0]?.id || null;
        persist();
        render();
      });
    }

    function renderPhotos(listing) {
      const photos = document.getElementById("photos");
      if (!photos) return;
      photos.innerHTML = "";
      for (const photo of listing.photos) {
        const wrap = document.createElement("div");
        wrap.className = "photo";
        wrap.innerHTML = `<img alt="" src="${photo.dataUrl}"><button type="button">削除</button>`;
        wrap.querySelector("button").addEventListener("click", () => {
          listing.photos = listing.photos.filter((item) => item.id !== photo.id);
          listing.photos.forEach((item, index) => {
            item.fileName = `${listing.itemId}_${String(index + 1).padStart(2, "0")}.jpg`;
          });
          persist();
          renderPhotos(listing);
          renderList();
          updateValidation(listing);
        });
        photos.appendChild(wrap);
      }
    }

    async function addFilesToListing(input, listing) {
      const files = [...input.files].slice(0, PHOTO_LIMIT - listing.photos.length);
      for (const file of files) {
        const index = listing.photos.length + 1;
        listing.photos.push({
          id: safeId(),
          fileName: `${listing.itemId}_${String(index).padStart(2, "0")}.jpg`,
          dataUrl: await fileToDataUrl(file),
          createdAt: new Date().toISOString(),
        });
      }
      input.value = "";
      listing.updatedAt = new Date().toISOString();
      persist();
      renderPhotos(listing);
      renderList();
      updateValidation(listing);
    }

    function setFormValues(form, listing) {
      for (const [name, value] of Object.entries(listing)) {
        const input = form.elements[name];
        if (input && typeof value !== "object") input.value = value ?? "";
      }
    }

    function applyFormValues(form, listing) {
      const data = new FormData(form);
      for (const [key, value] of data.entries()) {
        if (key in listing) listing[key] = String(value);
      }
    }

    function updateValidation(listing = currentListing()) {
      const box = document.getElementById("validationStatus");
      if (!box || !listing) return;
      const notes = [];
      if (!listing.title) notes.push("タイトル未入力");
      if (!listing.startPrice) notes.push("開始価格未入力");
      if (listing.photos.length === 0) notes.push("写真なし");

      box.innerHTML = notes.length
        ? `<strong>保存可能:</strong> <span class="missing">${notes.map(escapeHtml).join("、")}</span>。必要なら後で入力できます。`
        : "<strong>保存可能:</strong> 入力内容を出品データに含められます。";
    }

    function captureVideo(video) {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.88);
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function exportListingPackage() {
      if (state.listings.length === 0) {
        alert("出力する商品がありません。");
        return;
      }

      const encoder = new TextEncoder();
      const csvBytes = encoder.encode(`\ufeff${buildAuctownCsv()}`);
      const files = [{ name: "auctown-listings.csv", bytes: csvBytes }];

      for (const listing of state.listings) {
        for (const photo of listing.photos) {
          const blob = await fetch(photo.dataUrl).then((res) => res.blob());
          files.push({
            name: photo.fileName,
            bytes: new Uint8Array(await blob.arrayBuffer()),
          });
        }
      }

      const zipBlob = createZip(files);
      const fileName = `auctown-upload-${today()}.zip`;
      await saveOrShareBlob(zipBlob, fileName, "オークタウン出品データ");
      showDownloadLink(zipBlob, fileName);
      alert("納品ファイルを保存しました。保存されたZIPファイルをそのまま送ってください。");
    }

      if (state.listings.length === 0) {
        alert("共有する商品がありません。");
        return;
      }

      if (!confirm("これは編集を引き継ぐための控えデータです。納品する場合は「納品ファイル保存」を使ってください。共有データを保存しますか？")) {
        return;
      }

      const payload = {
        app: "yahooAuctionListingTool",
        version: 2,
        exportedAt: new Date().toISOString(),
        listings: state.listings,
        selectedId: state.selectedId,
      };
      const fileName = `auction-listing-share-${today()}.json`;
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json;charset=utf-8" });
      await saveOrShareBlob(blob, fileName, "ヤフオク出品共有データ");
      showDownloadLink(blob, fileName);
    }

    async function importShareData() {
      const file = els.importDataInput.files?.[0];
      els.importDataInput.value = "";
      if (!file) return;

      try {
        const payload = JSON.parse(await file.text());
        const incoming = Array.isArray(payload.listings) ? payload.listings : [];
        if (incoming.length === 0) {
          alert("読み込める商品データがありません。");
          return;
        }

        const existingKeys = new Set(state.listings.map((listing) => listing.id || listing.itemId));
        let added = 0;
        let skipped = 0;

        for (const rawListing of incoming) {
          const key = rawListing.id || rawListing.itemId;
          if (key && existingKeys.has(key)) {
            skipped += 1;
            continue;
          }

          const listing = createListing({
            ...rawListing,
            id: rawListing.id || safeId(),
            itemId: rawListing.itemId || buildItemId(),
            photos: Array.isArray(rawListing.photos) ? rawListing.photos : [],
          });
          state.listings.push(listing);
          existingKeys.add(listing.id || listing.itemId);
          added += 1;
        }

        if (!state.selectedId && state.listings[0]) state.selectedId = state.listings[0].id;
        const saved = await persist();
        renderList();
        render();
        alert(saved
          ? `共有データを読み込みました。追加 ${added}件 / 重複スキップ ${skipped}件`
          : "読み込みましたが、保存に失敗しました。端末の保存容量を確認してください。");
      } catch {
        alert("共有データを読み込めませんでした。JSONファイルを選択してください。");
      }
    }

    function createZip(files) {
      const chunks = [];
      const centralDirectory = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = new TextEncoder().encode(file.name);
        const bytes = file.bytes instanceof Uint8Array ? file.bytes : new Uint8Array(file.bytes);
        const crc = crc32(bytes);
        const localHeader = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(localHeader.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, 0, true);
        localView.setUint16(12, 0, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, bytes.length, true);
        localView.setUint32(22, bytes.length, true);
        localView.setUint16(26, nameBytes.length, true);
        localHeader.set(nameBytes, 30);
        chunks.push(localHeader, bytes);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(centralHeader.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, bytes.length, true);
        centralView.setUint32(24, bytes.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint32(42, offset, true);
        centralHeader.set(nameBytes, 46);
        centralDirectory.push(centralHeader);
        offset += localHeader.length + bytes.length;
      }

      const centralOffset = offset;
      const centralSize = centralDirectory.reduce((sum, item) => sum + item.length, 0);
      const endRecord = new Uint8Array(22);
      const endView = new DataView(endRecord.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, centralOffset, true);

      return new Blob([...chunks, ...centralDirectory, endRecord]);
    }

    function crc32(bytes) {
      let crc = -1;
      for (const byte of bytes) {
        crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 0xff];
      }
      return (crc ^ -1) >>> 0;
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let k = 0; k < 8; k += 1) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    })();

    function stopCamera() {
      if (!state.stream) return;
      for (const track of state.stream.getTracks()) track.stop();
      state.stream = null;
    }

    function currentListing() {
      return state.listings.find((listing) => listing.id === state.selectedId) || null;
    }

    async function load() {
      try {
        const raw = await readStoredState();
        if (!raw) return;
        const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
        state.listings = Array.isArray(parsed.listings) ? parsed.listings : [];
        state.selectedId = parsed.selectedId || state.listings[0]?.id || null;
      } catch {
        state.listings = [];
        state.selectedId = null;
      }
    }

    function schedulePersist(callback) {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(async () => {
        const saved = await persist();
        callback?.(saved);
      }, 250);
    }

    async function persist() {
      return writeStoredState({
        listings: state.listings,
        selectedId: state.selectedId,
      });
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          request.result.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function safeId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      if (window.crypto?.getRandomValues) {
        const bytes = new Uint32Array(4);
        window.crypto.getRandomValues(bytes);
        return [...bytes].map((value) => value.toString(16).padStart(8, "0")).join("-");
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    async function readStoredState() {
      if (!("indexedDB" in window)) {
        return localStorage.getItem(STORAGE_KEY);
      }

      try {
        const db = await openDb();
        const stored = await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const request = tx.objectStore(DB_STORE).get(STORAGE_KEY);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return stored || localStorage.getItem(STORAGE_KEY);
      } catch {
        return localStorage.getItem(STORAGE_KEY);
      }
    }

    async function writeStoredState(value) {
      if (!("indexedDB" in window)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
        return true;
      }

      try {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readwrite");
          tx.objectStore(DB_STORE).put(value, STORAGE_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            selectedId: value.selectedId,
            listings: value.listings.map((listing) => ({
              ...listing,
              photos: listing.photos.map((photo) => ({
                id: photo.id,
                fileName: photo.fileName,
                createdAt: photo.createdAt,
              })),
            })),
          }));
        } catch {
          // IndexedDB has the full data. The localStorage mirror is only a fallback index.
        }
        return true;
      } catch {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
          return true;
        } catch {
          alert("保存容量が不足しています。不要な商品や写真を削除してください。");
          return false;
        }
      }
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function saveOrShareBlob(blob, fileName, title) {
      const file = new File([blob], fileName, { type: blob.type || "application/octet-stream" });
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({
            title,
            text: title,
            files: [file],
          });
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }
      downloadBlob(blob, fileName);
    }

    function showDownloadLink(blob, fileName) {
      const box = document.getElementById("downloadStatus");
      if (!box) {
        alert(`${fileName} を保存しました。見つからない場合はブラウザのダウンロード一覧を確認してください。`);
        return;
      }
      const url = URL.createObjectURL(blob);
      box.hidden = false;
      box.innerHTML = `<strong>保存しました:</strong> <a href="${url}" download="${escapeHtml(fileName)}">${escapeHtml(fileName)}</a>`;
    }

    function escapeCsv(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    }

    function cleanCsvText(value) {
      return String(value ?? "")
        .replaceAll(",", "、")
        .replaceAll('"', "")
        .replaceAll("'", "")
        .replace(/\r?\n/g, " ")
        .trim();
    }

    function formatDescriptionForAuctown(value) {
      return String(value ?? "")
        .replaceAll(",", "、")
        .replaceAll('"', "")
        .replaceAll("'", "")
        .replace(/\r?\n/g, "<br>")
        .trim();
    }

    function normalizeEndHour(value) {
      const match = String(value ?? "").match(/\d+/);
      if (!match) return "21";
      const hour = Math.max(0, Math.min(23, Number(match[0])));
      return String(hour);
    }

    function returnsAllowed(value) {
      return String(value ?? "").includes("返品可") && !String(value ?? "").includes("返品不可")
        ? "返品可"
        : "返品不可";
    }

    function packageSizeForAuctown(value) {
      const text = String(value ?? "");
      if (text.includes("60")) return "～60cm";
      if (text.includes("70")) return "～70cm";
      if (text.includes("80")) return "～80cm";
      if (text.includes("100")) return "～100cm";
      if (text.includes("120")) return "～120cm";
      if (text.includes("130")) return "～130cm";
      if (text.includes("140")) return "～140cm";
      if (text.includes("160")) return "～160cm";
      if (text.includes("170")) return "～170cm";
      if (text.includes("大型")) return "170cm～";
      return "";
    }

    function deliveryMethodFlags(value) {
      const text = String(value ?? "");
      const flags = {
        nekoposu: "いいえ",
        compact: "いいえ",
        takkyubin: "いいえ",
        yuPacket: "いいえ",
        yuPack: "いいえ",
        customMethod: "",
      };

      if (text.includes("ネコポス")) flags.nekoposu = "はい";
      else if (text.includes("コンパクト")) flags.compact = "はい";
      else if (text.includes("ヤマト") || text.includes("宅急便")) flags.takkyubin = "はい";
      else if (text.includes("ゆうパケット")) flags.yuPacket = "はい";
      else if (text.includes("ゆうパック") || text.includes("日本郵便")) flags.yuPack = "はい";
      else flags.customMethod = cleanCsvText(text).slice(0, 15);

      return flags;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[char]);
    }

    function statusLabel(status) {
      return {
        draft: "下書き",
        needs_review: "確認待ち",
        ready: "CSV出力OK",
        blocked: "出品停止",
      }[status] || status;
    }

    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
  </script>
</body>
</html>
